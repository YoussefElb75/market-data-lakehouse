# Declarative Automation Bundle (formerly Databricks Asset Bundle).
#
# The workspace host is NOT stored here: it comes from the local Databricks CLI
# profile, e.g.  databricks bundle deploy -t dev -p mdl
# (profile created with: databricks auth login --host https://<workspace-host> --profile mdl).
# Before the first deploy of a target, create its catalog once:
#   python scripts/uc_bootstrap.py --profile mdl --env dev
bundle:
  name: market-data-lakehouse

include:
  - resources/*.yml

sync:
  exclude:
    - probe/**
    - docs/**
    - .github/**

variables:
  catalog:
    description: Unity Catalog catalog of this environment (one catalog per environment).
  backfill_start:
    description: First observation date loaded from the ECB on an empty landing zone.
    default: "2020-01-01"
  backfill_window_days:
    description: Length of one ECB backfill request window.
    default: "366"
  backfill_max_windows:
    description: Backfill windows per dataset and run (keeps each run small).
    default: "8"
  serverless_env:
    description: Serverless environment version for job tasks (6 = Python 3.12, Spark 4.2).
    default: "6"
  schedule_pause:
    description: Pause status of the daily schedule.
    default: PAUSED
  # Roles are service principals (scripts/uc_principals.py creates them). Their application
  # ids are resolved by display name at deploy time and never stored in the repository.
  pipeline_sp:
    description: Application id of the mdl-pipeline service principal (writes all layers).
    lookup:
      service_principal: mdl-pipeline
  analyst_sp:
    description: Application id of the mdl-analyst service principal (reads gold).
    lookup:
      service_principal: mdl-analyst

targets:
  dev:
    default: true
    # Not `mode: development`: it prefixes every schema with dev_<user>_, while this
    # project isolates environments by catalog (mdl_dev) and addresses layers by their
    # plain schema names. The development behaviour that matters is set explicitly.
    presets:
      pipelines_development: true
      trigger_pause_status: PAUSED
      jobs_max_concurrent_runs: 1
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mdl_dev
    resources:
      # Dev only: scratch storage and a job that runs the file-I/O and Delta tests on
      # serverless (they cannot run on the Windows laptop without winutils).
      schemas:
        scratch:
          catalog_name: ${var.catalog}
          name: scratch
          comment: Dev-only scratch tables created and dropped by the test job.
      volumes:
        scratch:
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.scratch.name}
          name: files
          volume_type: MANAGED
          comment: Dev-only scratch files for the test job.
      jobs:
        tests:
          name: mdl-tests-${bundle.target}
          description: pytest on serverless for the tests that need Spark file I/O and Delta.
          max_concurrent_runs: 1
          timeout_seconds: 1800
          environments:
            - environment_key: tests
              spec:
                environment_version: ${var.serverless_env}
                dependencies:
                  - ${workspace.file_path}
                  - pytest==9.2.0
          tasks:
            - task_key: pytest_delta_localfs
              environment_key: tests
              disable_auto_optimization: true
              max_retries: 0
              spark_python_task:
                python_file: ./jobs/run_tests.py
                parameters:
                  - --root
                  - ${workspace.file_path}
                  - --scratch-volume
                  - /Volumes/${var.catalog}/${resources.schemas.scratch.name}/${resources.volumes.scratch.name}
                  - --scratch-schema
                  - ${var.catalog}.${resources.schemas.scratch.name}
                  - --
                  - -m
                  - delta or localfs
                  - -v

  prod:
    mode: production
    variables:
      catalog: mdl_prod
      schedule_pause: UNPAUSED
    workspace:
      # Deployed by an admin; jobs and the pipeline run as the mdl-pipeline service principal.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.pipeline_sp}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - service_principal_name: ${var.pipeline_sp}
        level: CAN_MANAGE
      - service_principal_name: ${var.analyst_sp}
        level: CAN_VIEW
    resources:
      schemas:
        landing: {lifecycle: {prevent_destroy: true}}
        bronze: {lifecycle: {prevent_destroy: true}}
        silver: {lifecycle: {prevent_destroy: true}}
        gold: {lifecycle: {prevent_destroy: true}}
        ops: {lifecycle: {prevent_destroy: true}}
