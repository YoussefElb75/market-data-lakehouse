apiVersion: mdl/v1
kind: DataContract
id: gold.ohlcv_1m
version: 1.0.0
status: active
owner: data-engineering
description: >-
  One-minute OHLCV bars with VWAP and trade count per synthetic instrument,
  built from deduplicated, validated synthetic trades. Synthetic data only.
source: synth.trades
license: 'Synthetic data generated by this project (MIT)'
tags: {layer: gold, domain: market_microstructure, source: synthetic, pii: "false"}
primary_key: [symbol, bar_start]
freshness: {dataset: trades, max_lag_hours: 24}
schema:
  - {name: symbol, type: string, nullable: false, description: Synthetic instrument (SYN-*)}
  - {name: bar_start, type: timestamp, nullable: false, description: "Bar open time (UTC, inclusive)"}
  - {name: bar_end, type: timestamp, nullable: false, description: "Bar close time (UTC, exclusive)"}
  - {name: open, type: double, nullable: false, description: First trade price in the bar}
  - {name: high, type: double, nullable: false, description: Highest trade price}
  - {name: low, type: double, nullable: false, description: Lowest trade price}
  - {name: close, type: double, nullable: false, description: Last trade price in the bar}
  - {name: volume, type: double, nullable: false, description: Sum of traded quantity}
  - {name: vwap, type: double, nullable: false, description: Volume-weighted average price}
  - {name: trade_count, type: bigint, nullable: false, description: Number of trades}
quality:
  - {name: high_low_order, sql: low <= high}
  - {name: open_in_range, sql: open BETWEEN low AND high}
  - {name: close_in_range, sql: close BETWEEN low AND high}
  - {name: vwap_in_range, sql: vwap BETWEEN low - 1e-9 AND high + 1e-9}
  - {name: positive_volume, sql: volume > 0 AND trade_count > 0}
