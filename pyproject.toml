[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdl"
version = "0.1.0"
description = "Market data lakehouse on Databricks: medallion architecture, Lakeflow, Unity Catalog"
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
authors = [{ name = "YoussefElb75" }]
# Runtime dependencies are pinned to the versions of Databricks serverless
# environment 6 so that local and remote behave the same.
dependencies = [
    "requests==2.32.5",
    "numpy==2.3.4",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
spark = [
    "pyspark==4.2.0",
    "delta-spark==4.4.1",
    "pandas==2.3.3",
    "pyarrow==21.0.0",
]
dev = [
    "pytest==9.2.0",
    "mypy==2.4.1",
    "ruff==0.17.3",
    "types-requests==2.32.4.20260324",
    "types-PyYAML==6.0.12.20261103",
    "pandas-stubs==2.3.3.260113",
    "matplotlib==3.11.2",
]

[project.scripts]
mdl = "mdl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdl = ["py.typed", "contracts/*.yml"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts", "probe"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PTH", "PL", "C4", "PT", "BLE", "A"]
ignore = [
    "PLR0913",  # Spark builders legitimately take many parameters
    "PLR2004",  # magic numbers are fine in tests and market conventions
    "N812",     # `functions as F` is the PySpark convention
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"probe/**" = ["T201", "PLR0912", "PLR0915"]
"probe/bundle/**" = ["F821", "N999"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["delta.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "spark: needs a local SparkSession (Java 21)",
    "delta: needs Delta Lake writes; skipped on Windows without winutils, runs in Linux CI",
]
filterwarnings = ["ignore::DeprecationWarning:pyspark.*"]
